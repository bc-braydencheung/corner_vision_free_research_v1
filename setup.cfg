[metadata]
name = edgewise
version = 1.1.0
description = Leakage-safe football corner and personal-research HK racing forecasts

[options]
packages = find:
python_requires = >=3.10
install_requires =
    beautifulsoup4==4.12.3
    joblib==1.4.2
    lxml==5.3.0
    numpy==2.2.1
    pandas==2.2.3
    requests==2.32.3
    scikit-learn==1.6.0
    scipy==1.14.1

[options.packages.find]
include =
    forecasting*
