[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edgewise"
version = "1.1.0"
description = "Leakage-safe football corner and personal-research HK racing forecasts"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.12.3",
    "joblib==1.4.2",
    "lxml==5.3.0",
    "numpy==2.2.1",
    "pandas==2.2.3",
    "requests==2.32.3",
    "scikit-learn==1.6.0",
    "scipy==1.14.1",
]

[tool.setuptools.packages.find]
include = ["forecasting*"]
