name: Deploy Mark Six Data

on:
  push:
    paths: ['marksix_draws.json']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages
        run: |
          mkdir -p _site
          cp marksix_draws.json _site/draws.json
          echo '<h1>HKJC Mark Six Mirror</h1>' > _site/index.html
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
        id: deployment
