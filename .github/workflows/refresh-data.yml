name: Refresh forecast data

on:
  schedule:
    - cron: "17 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - id: restore-data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: football-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            football-data-${{ runner.os }}-
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m forecasting --output public/latest.json --cache-dir data/raw
      - uses: actions/cache/save@v4
        with:
          path: data/raw
          key: football-data-${{ runner.os }}-${{ github.run_id }}
      - run: cp public/latest.json public/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
