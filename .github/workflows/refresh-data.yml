name: Refresh forecast data

on:
  schedule:
    - cron: "17 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - id: restore-data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: football-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            football-data-${{ runner.os }}-
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m forecasting --output public/latest.json --cache-dir data/raw
      - uses: actions/cache/save@v4
        with:
          path: data/raw
          key: football-data-${{ runner.os }}-${{ github.run_id }}
      - run: cp public/latest.json public/index.json
      # Keep the Mark Six mirror published by refresh-marksix.yml: a Pages
      # deployment replaces the whole site.
      - run: cp marksix_draws.json public/draws.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      # raw.githubusercontent / jsDelivr / Statically can only serve committed
      # files, so the same payload is mirrored on a single-commit gh-pages
      # branch (force-pushed to keep the repository small).
      - name: Mirror payload on gh-pages
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          git init -q -b gh-pages "$tmp"
          curl -fsSL -o "$tmp/draws.json" \
            "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/draws.json" \
            || rm -f "$tmp/draws.json"
          cp public/latest.json public/index.json "$tmp/"
          git -C "$tmp" add -A
          git -C "$tmp" \
            -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "Mirror forecast payload"
          git -C "$tmp" push -q --force "$REMOTE" gh-pages
